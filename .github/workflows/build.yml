name: Build AAR

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Build with Gradle
        run: ./gradlew :vva-android:assembleRelease
        
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: vva-android/build/outputs/aar/vva-android-release.aar
          
