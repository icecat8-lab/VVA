name: Build AAR

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      # ใช้ Action ของ Gradle อย่างเป็นทางการ โหลดและติดตั้งให้แบบอัตโนมัติ
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.4'
          
      # สั่งรันคำสั่ง gradle ตรงๆ โดยไม่ต้องพึ่งไฟล์ ./gradlew
      - name: Build with Gradle
        run: gradle :android:assembleRelease --no-daemon
        
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: android/build/outputs/aar/android-release.aar
