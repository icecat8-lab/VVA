name: Build AAR

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Download and Install Gradle
        run: |
          wget https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip
          echo "$PWD/gradle-8.4/bin" >> $GITHUB_PATH
          
      - name: Build with Gradle
        run: gradle :vva-android:assembleRelease --no-daemon
        
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: vva-android/build/outputs/aar/vva-android-release.aar
