name: Build VVA

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 26.3.11579264
      TAG: ${{ inputs.version_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Host tests (real sources, ASan + UBSan, numpy reference)
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet numpy pillow
          /tmp/venv/bin/python tests/test_format.py
          /tmp/venv/bin/python tests/test_converter.py
          /tmp/venv/bin/python tests/test_engine.py
          /tmp/venv/bin/python tests/test_gpu_plan.py
          /tmp/venv/bin/python tests/check_jni.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install and locate NDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          NDK="$SDK/ndk/$NDK_VERSION"
          if [ ! -d "$NDK" ]; then
            SDKM="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
            test -n "$SDKM" || { echo "::error::sdkmanager not found under $SDK"; exit 1; }
            set +o pipefail
            yes | "$SDKM" --install "ndk;$NDK_VERSION" > /dev/null
            set -o pipefail
          fi
          test -d "$NDK" || { echo "::error::NDK not found at $NDK"; exit 1; }
          echo "NDK=$NDK" >> "$GITHUB_ENV"

      - name: Compile GPU kernels (optional)
        continue-on-error: true
        run: |
          python3 tools/gen_spirv.py --glslc "$NDK/shader-tools/linux-x86_64/glslc" \
            || { echo "::warning::GPU kernels were not built; the library will run on the CPU only"; rm -f core/src/gpu/spirv_data.h; }

      - name: Build AAR
        run: gradle :vva-android:assembleRelease --no-daemon --stacktrace

      - name: Build native SDK (libvva.so and vva-cli)
        run: |
          cmake -S . -B build-native \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DVVA_BUILD_SHARED=ON \
            -DVVA_BUILD_CLI=ON
          cmake --build build-native --parallel

      - name: Build GPU benchmark (optional)
        continue-on-error: true
        run: |
          GLSLC="$NDK/shader-tools/linux-x86_64/glslc"
          test -x "$GLSLC" || { echo "::error::glslc not found in the NDK"; exit 1; }
          mkdir -p dist-bench
          "$GLSLC" -O --target-env=vulkan1.1 -o dist-bench/conv3x3.spv tools/gpubench/conv3x3.comp
          "$GLSLC" -O --target-env=vulkan1.1 -o dist-bench/conv3x3_t4.spv tools/gpubench/conv3x3_t4.comp || echo "::warning::tiled fp32 shader failed to compile"
          "$GLSLC" -O --target-env=vulkan1.1 -o dist-bench/conv3x3_t4_f16.spv tools/gpubench/conv3x3_t4_f16.comp || echo "::warning::fp16 shader failed to compile"
          cmake -S . -B build-bench \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DVVA_BUILD_GPUBENCH=ON
          cmake --build build-bench --target vva-gpubench
          cp build-bench/vva-gpubench dist-bench/vva-gpubench-arm64-v8a

      - name: Collect release files
        run: |
          mkdir -p dist
          AAR="$(find android/vva-android/build/outputs/aar -name '*-release.aar' | head -n 1)"
          test -n "$AAR" || { echo "::error::release AAR not found"; exit 1; }
          cp "$AAR" "dist/vva-android-$TAG.aar"
          cp build-native/vva-cli dist/vva-cli-arm64-v8a
          cp build-native/libvva.so dist/libvva-arm64-v8a.so
          cp docs/FORMAT.md dist/VVA_FORMAT.md
          cp dist-bench/* dist/ 2>/dev/null || echo "GPU benchmark not built"

          LIST="$(unzip -l "dist/vva-android-$TAG.aar")"
          echo "$LIST"
          case "$LIST" in
            *jni/arm64-v8a/libvva_engine.so*) ;;
            *) echo "::error::AAR does not contain libvva_engine.so"; exit 1 ;;
          esac
          ls -l dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vva-dist
          path: dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version_tag }}
          name: VVA ${{ inputs.version_tag }}
          files: dist/*
