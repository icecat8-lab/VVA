plugins {
    id 'com.android.library'
}

android {
    namespace 'com.vva.engine'
    compileSdk 34
    ndkVersion '26.3.11579264'

    defaultConfig {
        minSdk 26

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DVVA_BUILD_JNI=ON', '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
